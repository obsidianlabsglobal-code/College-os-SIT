name: Deploy release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
  statuses: read
  checks: read
concurrency:
  group: nexus-release-candidate
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: release-candidate
    env:
      GH_TOKEN: ${{ github.token }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      RELEASE_URL: ${{ vars.RELEASE_URL }}
      HEALTH_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Require a verified main commit and release configuration
        run: |
          test "$GITHUB_REF" = refs/heads/main
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" \
            --jq '.check_runs[] | select(.name == "verify" and .app.slug == "github-actions" and .conclusion == "success") | .id' | grep -q .
          test -n "$VERCEL_TOKEN" && test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID"
          test -n "$MIGRATION_DATABASE_URL" && test -n "$HEALTH_BYPASS"
          case "$RELEASE_URL" in https://*) ;; *) exit 1 ;; esac
      - run: npm ci
      - name: Build the Vercel release artifact
        run: |
          npx --yes vercel@66.6.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@66.6.0 build --prod --token="$VERCEL_TOKEN"
      - run: npm run db:migrate
      - name: Deploy and verify the staging URL
        run: |
          npx --yes vercel@66.6.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            -H "x-vercel-protection-bypass: $HEALTH_BYPASS" "${RELEASE_URL%/}/api/health" | jq -e '.status == "ok"'
          curl --fail --silent --show-error --retry 2 \
            -H "x-vercel-protection-bypass: $HEALTH_BYPASS" "${RELEASE_URL%/}/login" | grep -q 'Sign in'
