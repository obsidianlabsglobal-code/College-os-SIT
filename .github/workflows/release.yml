name: Deploy release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
  statuses: read
  checks: read
concurrency:
  group: nexus-release-candidate
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: release-candidate
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      RELEASE_URL: ${{ vars.RELEASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Require a verified main commit and release configuration
        env:
          GH_TOKEN: ${{ github.token }}
          NEXUS_ACCEPTANCE_HOST: ${{ vars.NEXUS_ACCEPTANCE_HOST }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" \
            --jq '.check_runs[] | select(.name == "verify" and .app.slug == "github-actions" and .conclusion == "success") | .id' | grep -q .
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          node --input-type=module <<'JS'
          const url = new URL(process.env.RELEASE_URL);
          if (url.protocol !== "https:" || url.host !== process.env.NEXUS_ACCEPTANCE_HOST || url.href !== url.origin + "/") {
            throw new Error("Configure the approved NEXUS staging HTTPS origin.");
          }
          JS
      - run: npm ci
      - name: Build the Vercel release artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN"
          npx --yes vercel@66.6.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@66.6.0 build --prod --token="$VERCEL_TOKEN"
      - name: Migrate the approved staging database
        run: |
          test -n "$NEXUS_MIGRATION_TARGET"
          test -n "$MIGRATION_DATABASE_URL"
          npm run db:migrate
        env:
          NEXUS_MIGRATION_TARGET: ${{ vars.NEXUS_MIGRATION_TARGET }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      - name: Deploy the staging artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel@66.6.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
      - name: Verify the configured staging alias
        env:
          HEALTH_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          curl_flags=(--fail --silent --show-error)
          if [ -n "$HEALTH_BYPASS" ]; then
            curl_flags+=(-H "x-vercel-protection-bypass: $HEALTH_BYPASS")
          fi
          curl "${curl_flags[@]}" --retry 5 --retry-all-errors "${RELEASE_URL%/}/api/health" | jq -e '.status == "ok"'
          curl "${curl_flags[@]}" --retry 2 "${RELEASE_URL%/}/login" | grep -q 'Sign in'
