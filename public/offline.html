<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · NEXUS</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f9f7f3; color: #1f1d2b; }
  @media (prefers-color-scheme: dark) { body { background: #171720; color: #ecebf5; } }
  main { max-width: 22rem; padding: 1.5rem; text-align: center; }
  img { width: 64px; height: 64px; border-radius: 16px; }
  h1 { font-size: 1.4rem; margin: 1rem 0 .5rem; }
  p { line-height: 1.5; }
  button { font: inherit; padding: .7rem 1.2rem; border-radius: .6rem; border: 0; background: #6e54b7; color: #fff; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>You are offline</h1>
  <p>NEXUS needs a connection to show your classes, buses and requests. Nothing is stored on this phone.</p>
  <p>If you are waiting for a bus, it runs as usual. Check the stop schedule.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
